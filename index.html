<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus4ward — Client documents</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1E2530;--pink:#C9316E;--sand:#F5F0EB}
html,body{height:100%}
body{font-family:'Space Grotesk',sans-serif;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.card{max-width:520px;text-align:center}
.logo{display:inline-block;margin-bottom:28px}
.logo img{height:48px;width:auto;display:block}
h1{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-0.5px;margin-bottom:14px}
p{font-size:16px;line-height:1.6;color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="card">
<div class="logo"><img src="/images/logo-light.png" alt="Focus4ward"></div>
<h1>Client documents</h1>
<p>This space is private. If you were sent a link, open it directly. Otherwise there's nothing to see here.</p>
</div>
</body>
</html>
