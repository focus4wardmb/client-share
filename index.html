<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus4ward — Client space</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1E2530;--pink:#C9316E}
html,body{height:100%}
body{font-family:'Space Grotesk',sans-serif;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased}
.card{text-align:center}
.logo{display:block;margin:0 auto 36px;height:34px;width:auto;opacity:.95}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.dot{color:var(--pink)}
</style>
</head>
<body>
<div class="card">
<img src="/images/logo-light.png" alt="Focus4ward" class="logo">
<div class="eyebrow">Client space<span class="dot">.</span></div>
</div>
</body>
</html>
